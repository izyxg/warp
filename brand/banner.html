<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>warp-banner</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,700;12..96,75..100,800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--void:#0A0A0E;--edge:#20202B;--ink:#F7F7FA;--ink3:#7A7A8A;
  --vio:#9B80FF;--cyan:#3FDCEA;--gold:#F5BB4E;--ok:#4BE3A6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void)}
.b{width:1500px;height:500px;position:relative;background:var(--void);overflow:hidden}

/* bigger cells and a heavier line, so X's compression cannot smear them */
.g{position:absolute;inset:0;opacity:.62;
  background-image:linear-gradient(var(--edge) 2px,transparent 2px),linear-gradient(90deg,var(--edge) 2px,transparent 2px);
  background-size:100px 100px}
.rule{position:absolute;left:0;right:0;top:0;height:5px;
  background:linear-gradient(90deg,var(--vio),#5C86FF 24%,var(--cyan) 48%,var(--ok) 66%,var(--gold) 84%,var(--vio))}
.glow{position:absolute;right:-120px;top:-220px;width:900px;height:900px;
  background:radial-gradient(circle,rgba(155,128,255,.24),rgba(0,0,0,0) 60%)}

/* the profile picture covers the bottom-left, so nothing lives there */
.in{position:absolute;left:376px;top:50%;transform:translateY(-50%);z-index:3}
h1{font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-variation-settings:'wdth' 84;
  font-size:112px;line-height:.9;letter-spacing:-.045em;color:var(--ink);margin:0}
.line{font-family:'JetBrains Mono',monospace;font-size:23px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--vio);margin-top:26px}

/* one big mark instead of a wall of tiny cards */
.mk{position:absolute;right:118px;top:50%;transform:translateY(-50%);z-index:2}
.mk svg{width:330px;height:330px;display:block}
</style>
</head>
<body>
<div class="b">
  <div class="g"></div><div class="glow"></div><div class="rule"></div>
  <div class="in">
    <h1>Fees in.<br>Hours out.</h1>
    <div class="line">Trading fees → RTX 5090 hours</div>
  </div>
  <div class="mk">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="8" width="26" height="16" rx="1" fill="none" stroke="#F7F7FA" stroke-width="1.35"/>
      <circle cx="11" cy="16" r="3.6" fill="none" stroke="#9B80FF" stroke-width="1.35"/>
      <circle cx="21" cy="16" r="3.6" fill="none" stroke="#9B80FF" stroke-width="1.35"/>
      <path d="M7 24v4M25 24v4" stroke="#F7F7FA" stroke-width="1.35" stroke-linecap="round"/>
      <path d="M3 11H1M3 16H1M3 21H1" stroke="#F7F7FA" stroke-width="1.35" stroke-linecap="round"/>
    </svg>
  </div>
</div>
</body>
</html>
