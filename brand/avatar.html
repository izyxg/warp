<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>warp-avatar</title>
<style>
:root{--void:#0A0A0E;--edge:#1D1D26;--ink:#F7F7FA;--vio:#9B80FF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void)}
.a{width:1000px;height:1000px;position:relative;background:var(--void);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.g{position:absolute;inset:0;opacity:.6;
  background-image:linear-gradient(var(--edge) 2px,transparent 2px),linear-gradient(90deg,var(--edge) 2px,transparent 2px);
  background-size:125px 125px}
.hz{position:absolute;width:1100px;height:1100px;
  background:radial-gradient(circle,rgba(155,128,255,.16),rgba(0,0,0,0) 62%)}
svg{position:relative;z-index:2;width:660px;height:660px}
</style>
</head>
<body>
<div class="a">
  <div class="g"></div><div class="hz"></div>
  <svg viewBox="0 0 32 32" aria-label="Warp">
    <rect x="3" y="8" width="26" height="16" rx="1" fill="none" stroke="#F7F7FA" stroke-width="1.55"/>
    <circle cx="11" cy="16" r="3.6" fill="none" stroke="#9B80FF" stroke-width="1.55"/>
    <circle cx="21" cy="16" r="3.6" fill="none" stroke="#9B80FF" stroke-width="1.55"/>
    <path d="M7 24v4M25 24v4" stroke="#F7F7FA" stroke-width="1.55" stroke-linecap="round"/>
    <path d="M3 11H1M3 16H1M3 21H1" stroke="#F7F7FA" stroke-width="1.55" stroke-linecap="round"/>
  </svg>
</div>
</body>
</html>
